<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Seedlings</title><link rel="stylesheet" href="styles.css"></head>
<body>

<main class="section"><div class="container"><div class="account-shell"><section class="account-main"><div class="account-title"><div><div class="eyebrow">Profile</div><h1>My Profile</h1><p class="muted">Your customer account information.</p></div></div><div class="profile-photo-card"><div class="profile-photo-stage"><div class="profile-photo-preview" data-profile-photo-preview aria-label="Profile photo"><img src="/profile-default.jpg" alt="Default profile photo"></div><button class="profile-photo-remove" type="button" data-profile-photo-remove hidden aria-label="Remove profile photo" title="Remove profile photo">×</button></div><div class="profile-photo-content"><h3>Profile photo</h3><p class="muted">Add a photo so your profile is easy to recognize.</p><input data-profile-photo-input type="file" accept="image/*" hidden><button class="btn outline" type="button" data-profile-photo-choose>Upload photo</button><p class="profile-photo-message" data-profile-photo-message></p></div></div><div class="form"><div class="contact-grid"><div><label>Full name<input value="" placeholder="Not provided"></label><label>Mobile number<input value="" placeholder="Mobile number" disabled></label></div><div><label>Email<input value="" placeholder="Not provided"></label><label>Preferred delivery day<select disabled><option value="Saturday" selected>Saturday</option></select></label></div></div><div class="actions"><button class="btn primary">Save changes</button></div></div></section></div></div></main>
<script src="script.js"></script></body></html>
